name: Deploy Arafagift

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Update source on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: colorado.iixcp.rumahweb.net
          username: izim8295
          port: 2223
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/izim8295/arafagift

            git fetch origin main
            git reset --hard origin/main

            php -d disable_functions=none ~/bin/composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist

      - name: Upload Vite build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: colorado.iixcp.rumahweb.net
          username: izim8295
          port: 2223
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/build"
          target: "/home/izim8295/arafagift/public"
          strip_components: 1
          overwrite: true

      - name: Run Laravel deployment tasks
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: colorado.iixcp.rumahweb.net
          username: izim8295
          port: 2223
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/izim8295/arafagift

            php -d disable_functions=none artisan migrate --force

            php -d disable_functions=none artisan optimize