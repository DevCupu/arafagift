name: Deploy Arafagift

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install frontend dependencies
      - name: Install Node dependencies
        run: npm ci

      # 4. Build frontend di GitHub Actions
      - name: Build frontend
        run: npm run build

      # 5. Update source + Composer di server
      - name: Update source and install PHP dependencies
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/izim8295/arafagift

            git fetch origin main
            git reset --hard origin/main

            php -d disable_functions=none ~/bin/composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist

      # 6. Upload hasil Vite
      - name: Upload Vite build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/build"
          target: "/home/izim8295/arafagift/public"
          strip_components: 1
          overwrite: true

      # 7. Maintenance + migration + optimize
      - name: Run Laravel deployment tasks
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/izim8295/arafagift

            # Pastikan maintenance dimatikan walaupun deployment gagal
            trap 'php artisan up || true' EXIT

            php artisan down --render="errors::503"

            php artisan migrate --force
            php artisan optimize
            php artisan app:cache-warm

            php artisan up
            trap - EXIT

      # 8. Smoke test SEO dari jalur publik
      #
      # Jalankan dari luar server, lewat HTTPS publik, karena itu yang sebenarnya
      # dibaca Google. Sitemap pernah 500 selama berminggu-minggu tanpa ada yang
      # tahu: deploy tetap hijau, tidak ada alarm, tapi seluruh URL toko
      # berhenti terdiscover. Langkah ini yang menangkapnya.
      - name: Smoke test SEO endpoints
        shell: bash
        run: |
          set -euo pipefail

          base="https://arafagift.id"

          check() {
            local path="$1" expect="$2"
            local code
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$base$path")

            if [ "$code" != "$expect" ]; then
              echo "::error::$path balas $code, diharapkan $expect"
              head -c 500 /tmp/body
              exit 1
            fi

            echo "ok  $path -> $code"
          }

          check "/" "200"
          check "/robots.txt" "200"
          check "/sitemap.xml" "200"

          # Sitemap harus benar-benar XML, bukan halaman error 200-butih.
          curl -fsS "$base/sitemap.xml" -o /tmp/sitemap.xml
          if ! grep -q "<urlset" /tmp/sitemap.xml; then
            echo "::error::/sitemap.xml tidak berisi <urlset>"
            head -c 500 /tmp/sitemap.xml
            exit 1
          fi

          # Head harus sudah terisi di HTML pertama, tanpa menjalankan JS.
          curl -fsS "$base/" -o /tmp/home.html
          for tag in "<title>" 'name="description"' 'rel="canonical"'; do
            if ! grep -q "$tag" /tmp/home.html; then
              echo "::error::homepage tidak mengirim $tag di respons pertama"
              exit 1
            fi
          done

          # Brand harus konsisten tanpa huruf h.
          if grep -q "ArafahGift" /tmp/home.html; then
            echo "::error::homepage masih mengirim brand lama 'ArafahGift'"
            exit 1
          fi

          echo "Semua endpoint SEO sehat."

      # 9. Diagnosa mandiri saat smoke test gagal
      #
      # APP_DEBUG=false di produksi, jadi respons 500 selalu bodies kosong.
      # Tanpa langkah ini, "sitemap 500" hanya memberi tahu ada masalah tanpa
      # memberitahu penyebabnya, dan kita harus menebak dari luar. Ambil log
      # dan lingkungan server langsung ke log Actions.
      - name: Dump server diagnostics when smoke test fails
        if: failure()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set +e
            cd /home/izim8295/arafagift

            echo "===== PHP ====="
            php -v 2>&1 | head -2

            echo "===== storage/logs ====="
            ls -ld storage/logs 2>&1
            ls -l storage/logs 2>&1 | head

            echo "===== laravel.log (tail 120) ====="
            tail -n 120 storage/logs/laravel.log 2>&1

            echo "===== route sitemap ====="
            php artisan route:list --path=sitemap 2>&1

            echo "===== driver cache ====="
            php artisan about 2>&1 | sed -n '/^#* *Cache/,/^#* *[A-Z]/p'

            echo "===== isi cache ====="
            ls -la storage/framework/cache/data 2>&1 | head -30